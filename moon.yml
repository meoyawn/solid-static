language: typescript
layer: library
stack: frontend
tags: [node]
toolchains:
  default: node
fileGroups:
  browser:
    - compose/**/*
    - package.json
  sources:
    - src/**/*
    - package.json
    - tsconfig*.json
tasks:
  lint:
    command: nub exec oxlint --config .oxlintrc.json src e2e compose playwright.config.ts
    inputs:
      - .oxlintrc.json
      - compose/**/*.ts
      - src/**/*
      - e2e/**/*
      - playwright.config.ts
      - package.json
      - /nub.lock
  build:
    command: nub exec tsc -p tsconfig.build.json
    inputs:
      - src/**/*
      - package.json
      - tsconfig.json
      - tsconfig.build.json
      - /nub.lock
    outputs:
      - dist/**/*
  typecheck:
    command: nub exec tsc
    inputs:
      - src/**/*
      - package.json
      - tsconfig.json
      - /nub.lock
  typecheck-playwright:
    command: nub exec tsc -p tsconfig.playwright.json
    inputs:
      - compose/**/*.ts
      - src/**/*
      - e2e/**/*
      - package.json
      - playwright.config.ts
      - tsconfig.json
      - tsconfig.playwright.json
      - /nub.lock
  test-unit:
    command: nub exec vitest run
    deps:
      - ~:build
    inputs:
      - src/**/*
      - package.json
      - tsconfig.json
      - vitest.config.ts
      - /nub.lock
  test-e2e:
    command: nub exec playwright test
    deps:
      - ~:build
      - compose:up-d
    inputs:
      - "@group(browser)"
      - src/**/*
      - e2e/**/*
      - playwright.config.ts
      - tsconfig.playwright.json
      - package.json
      - /nub.lock
  check:
    deps:
      - ~:lint
      - ~:typecheck
      - ~:typecheck-playwright
      - ~:test-unit
      - ~:test-e2e
    options:
      runInCI: false
    inputs: []
  publish:
    command: nub publish --access public
    deps:
      - ~:check
      - ~:build
    options:
      cache: false
      runInCI: false
    inputs: []
