language: typescript
layer: library
stack: frontend
tags: [node]
toolchains:
  default: node
fileGroups:
  sources:
    - src/**/*
    - package.json
    - tsconfig*.json
tasks:
  lint:
    description: Format every TypeScript file with oxfmt, then lint them all with oxlint.
    inputs:
      - "**/*.{ts,tsx}"
      - "!node_modules/**/*"
      - "!dist/**/*"
      - .oxfmtrc.jsonc
      - .oxlintrc.json
      - package.json
      - /aube-lock.yaml
    script: |-
      set -euo pipefail
      # Tracked and new files Git doesn't ignore (no dist/ or fixtures' output).
      files=()
      while IFS= read -r -d '' file; do
        [[ -f $file ]] && files+=("$file")
      done < <(git ls-files -z --cached --others --exclude-standard -- '*.ts' '*.tsx')
      aube exec oxfmt "${files[@]}"
      aube exec oxlint --config .oxlintrc.json "${files[@]}"
  build:
    command: aube exec tsc -p tsconfig.build.json
    inputs:
      - src/**/*
      - package.json
      - tsconfig.json
      - tsconfig.build.json
      - /aube-lock.yaml
    outputs:
      - dist/**/*
  typecheck:
    command: aube exec tsc
    inputs:
      - src/**/*
      - package.json
      - tsconfig.json
      - /aube-lock.yaml
  test:
    command: aube exec vitest run
    deps:
      - ~:build
    inputs:
      - src/**/*
      - package.json
      - tsconfig.json
      - vitest.config.ts
      - /aube-lock.yaml
  check:
    deps:
      - ~:lint
      - ~:typecheck
      - ~:test
    options:
      runInCI: false
    inputs: []
  publish:
    command: aube publish --access public
    deps:
      - ~:check
      - ~:build
    options:
      cache: false
      runInCI: false
    inputs: []
