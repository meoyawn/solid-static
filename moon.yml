language: typescript
layer: library
stack: frontend
tags: [node]
toolchains:
  default: node
fileGroups:
  sources:
    - src/**/*
    - package.json
    - tsconfig*.json
tasks:
  lint:
    command: aube exec oxlint --config .oxlintrc.json src
    inputs:
      - .oxlintrc.json
      - src/**/*
      - package.json
      - /aube-lock.yaml
  build:
    command: aube exec tsc -p tsconfig.build.json
    inputs:
      - src/**/*
      - package.json
      - tsconfig.json
      - tsconfig.build.json
      - /aube-lock.yaml
    outputs:
      - dist/**/*
  typecheck:
    command: aube exec tsc
    inputs:
      - src/**/*
      - package.json
      - tsconfig.json
      - /aube-lock.yaml
  test:
    command: aube exec vitest run
    deps:
      - ~:build
    inputs:
      - src/**/*
      - package.json
      - tsconfig.json
      - vitest.config.ts
      - /aube-lock.yaml
  check:
    deps:
      - ~:lint
      - ~:typecheck
      - ~:test
    options:
      runInCI: false
    inputs: []
  publish:
    command: aube publish --access public
    deps:
      - ~:check
      - ~:build
    options:
      cache: false
      runInCI: false
    inputs: []
