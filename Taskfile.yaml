version: "3"

tasks:
  lint:
    run: once
    cmd: nubx oxlint src e2e playwright.config.ts
    sources:
      - nub.lock
      - package.json
      - playwright.config.ts
      - tsconfig.json
      - e2e/**/*
      - src/**/*

  typecheck:
    run: once
    cmd: nubx tsc
    sources:
      - nub.lock
      - package.json
      - tsconfig.json
      - src/**/*

  typecheck:playwright:
    run: once
    cmd: nubx tsc -p tsconfig.playwright.json
    sources:
      - e2e/**/*
      - nub.lock
      - package.json
      - playwright.config.ts
      - tsconfig.json
      - tsconfig.playwright.json

  test:unit:
    run: once
    cmd: nubx vitest run
    sources:
      - nub.lock
      - package.json
      - tsconfig.json
      - vitest.config.ts
      - src/**/*

  playwright:install:
    run: once
    cmd: nubx playwright install chromium
    sources:
      - nub.lock

  test:playwright:
    run: once
    deps:
      - playwright:install
    cmd: nubx playwright test
    sources:
      - e2e/**/*
      - nub.lock
      - package.json
      - playwright.config.ts
      - src/**/*

  test:
    deps:
      - test:unit
      - test:playwright

  build:
    run: once
    cmd: nubx tsc -p tsconfig.build.json
    sources:
      - nub.lock
      - package.json
      - tsconfig.json
      - tsconfig.build.json
      - src/**/*
    generates:
      - dist/**/*

  check:
    deps:
      - lint
      - typecheck
      - typecheck:playwright
      - test

  publish:
    deps:
      - check
      - build
    cmd: nub publish --access public
